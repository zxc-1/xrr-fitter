name: windows-executable

"on":
  workflow_dispatch:
    inputs:
      source_ref:
        description: Annotated release tag or exact source commit to package
        required: true
        default: R23-final
        type: string
      expected_commit:
        description: Exact 40-character source commit required after checkout
        required: true
        default: 1c2e49cd2efa5a6c722b60593b4f6560f77a02b2
        type: string

permissions:
  contents: read

concurrency:
  group: windows-executable-${{ inputs.expected_commit }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out packaging definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: builder
          persist-credentials: false
          fetch-depth: 1

      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Require exact release source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EXPECTED_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw "expected_commit must be a lowercase 40-character Git object ID"
          }
          $actual = git -C source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_COMMIT) {
            throw "source_ref resolved to $actual instead of $env:EXPECTED_COMMIT"
          }
          if (git -C source status --porcelain=v1 --untracked-files=all) {
            throw "release source checkout is dirty"
          }
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: builder/requirements-windows-x64-py312.lock

      - name: Install locked build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -c "import platform, struct, sys; assert sys.platform == 'win32' and platform.machine() == 'AMD64' and struct.calcsize('P') == 8 and sys.version_info[:2] == (3, 12)"
          python -m pip install pip==26.1.2
          python -m pip install --requirement builder/requirements-windows-x64-py312.lock
          python -m pip install --no-deps --no-build-isolation ./source
          python -m pip check

      - name: Build standalone executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:XRR_SOURCE_ROOT = (Resolve-Path source).Path
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --distpath "$env:RUNNER_TEMP/pyinstaller-dist" `
            --workpath "$env:RUNNER_TEMP/pyinstaller-work" `
            builder/packaging/windows/xrr-fitter.spec
          $release = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/windows-release"
          Move-Item `
            "$env:RUNNER_TEMP/pyinstaller-dist/xrr-fitter.exe" `
            "$release/xrr-fitter-0.2.0-windows-x86_64.exe"

      - name: Verify executable and smoke-test GUI startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $executable = "$env:RUNNER_TEMP/windows-release/xrr-fitter-0.2.0-windows-x86_64.exe"
          $file = Get-Item $executable
          if ($file.Length -lt 1MB) {
            throw "standalone executable is unexpectedly small: $($file.Length) bytes"
          }
          $stream = [System.IO.File]::OpenRead($executable)
          try {
            if ($stream.ReadByte() -ne 0x4D -or $stream.ReadByte() -ne 0x5A) {
              throw "standalone executable does not have a PE MZ header"
            }
          } finally {
            $stream.Dispose()
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:MPLCONFIGDIR = "$env:RUNNER_TEMP/matplotlib"
          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 20
            if ($process.HasExited) {
              throw "standalone GUI exited during startup with code $($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
          }

      - name: Write executable manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = "$env:RUNNER_TEMP/windows-release"
          $filename = "xrr-fitter-0.2.0-windows-x86_64.exe"
          $executable = Get-Item "$release/$filename"
          $hash = (Get-FileHash -Algorithm SHA256 $executable.FullName).Hash.ToLowerInvariant()
          $sourceTree = git -C source rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) {
            throw "could not resolve the release source tree"
          }
          $pythonVersion = python -c "import platform; print(platform.python_version())"
          $pyinstallerVersion = python -c "import PyInstaller; print(PyInstaller.__version__)"
          $manifest = [ordered]@{
            schema = "xrr-windows-executable-manifest-v1"
            status = "PASS"
            source_ref = $env:SOURCE_REF
            source_commit = $env:EXPECTED_COMMIT
            source_tree = $sourceTree
            builder_commit = $env:BUILDER_COMMIT
            platform = "windows-x86_64"
            python = $pythonVersion
            pyinstaller = $pyinstallerVersion
            smoke_test = "PASS: offscreen GUI remained alive for 20 seconds"
            executable = [ordered]@{
              filename = $filename
              size = $executable.Length
              sha256 = $hash
            }
          }
          $json = ($manifest | ConvertTo-Json -Depth 4 -Compress) + "`n"
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            "$release/xrr-fitter-0.2.0-windows-x86_64.json",
            $json,
            $utf8
          )
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          BUILDER_COMMIT: ${{ github.sha }}

      - name: Upload Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r23-windows-executable-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/windows-release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
