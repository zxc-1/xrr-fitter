name: hosted-release-verify

"on":
  workflow_dispatch:
    inputs:
      compute:
        description: Explicitly authorize new fits on the first manual attempt only
        type: boolean
        required: false
        default: false
      producer:
        description: Exact producer descriptor JSON for revalidation without new fits
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: hosted-release-verify-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  statistical:
    uses: ./.github/workflows/statistical.yml
    with:
      compute: ${{ inputs.compute || false }}
      producer: ${{ inputs.producer || '' }}

  release:
    needs: [statistical]
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download statistical shard evidence
        if: ${{ inputs.producer == '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: statistical-shard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/statistical-inputs
          merge-multiple: false
      - name: Set up locked macOS Python
        id: python
        uses: ./.github/actions/setup-macos-python
      - name: Verify release
        env:
          PYTHON: ${{ steps.python.outputs.python }}
          PRODUCER: ${{ inputs.producer }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PYTHON" = "${{ steps.python.outputs.python }}"
          STATISTICAL_ARGS=(--statistical-results "$RUNNER_TEMP/statistical-inputs")
          if test -n "$PRODUCER"; then
            "$PYTHON" tools/statistical_handoff.py --producer-json "$PRODUCER" --report-dir "$RUNNER_TEMP/statistical-handoff"
            STATISTICAL_ARGS=(--statistical-results "$RUNNER_TEMP/statistical-handoff/shards" --statistical-producer "$RUNNER_TEMP/statistical-handoff/producer.json")
          fi
          QT_QPA_PLATFORM=offscreen "$PYTHON" tools/verify.py release --report-dir "$RUNNER_TEMP/release" --artifact-dir "$RUNNER_TEMP/release/artifacts" "${STATISTICAL_ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/hosted-release-verify.log"
      - name: Clean the owned macOS environment
        if: ${{ always() && steps.python.outputs.job-root != '' }}
        uses: ./.github/actions/cleanup-macos-python
        with:
          job-root: ${{ steps.python.outputs.job-root }}
      - name: Retain full verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-release-verify-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hosted-release-verify.log
            ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
