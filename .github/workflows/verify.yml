name: verify

"on":
  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: [self-hosted, macOS, ARM64, xrr-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify quality
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64" and sys.version_info[:2] == (3, 12)'
          python3.12 -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install pip==26.1.2
          "$PYTHON" -m pip install -r requirements-macos-arm64-py312.lock
          "$PYTHON" tools/check_hygiene.py --require-git-clean
          "$PYTHON" tools/verify.py quality

  tools:
    runs-on: [self-hosted, macOS, ARM64, xrr-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64" and sys.version_info[:2] == (3, 12)'
          python3.12 -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install pip==26.1.2
          "$PYTHON" -m pip install -r requirements-macos-arm64-py312.lock
          "$PYTHON" tools/check_hygiene.py --require-git-clean
          "$PYTHON" tools/verify.py tools

  unit:
    runs-on: [self-hosted, macOS, ARM64, xrr-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify unit
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64" and sys.version_info[:2] == (3, 12)'
          python3.12 -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install pip==26.1.2
          "$PYTHON" -m pip install -r requirements-macos-arm64-py312.lock
          "$PYTHON" tools/check_hygiene.py --require-git-clean
          "$PYTHON" tools/verify.py unit

  gui:
    runs-on: [self-hosted, macOS, ARM64, xrr-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify gui
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64" and sys.version_info[:2] == (3, 12)'
          python3.12 -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install pip==26.1.2
          "$PYTHON" -m pip install -r requirements-macos-arm64-py312.lock
          "$PYTHON" tools/check_hygiene.py --require-git-clean
          QT_QPA_PLATFORM=offscreen "$PYTHON" tools/verify.py gui

  integration:
    runs-on: [self-hosted, macOS, ARM64, xrr-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify integration
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64" and sys.version_info[:2] == (3, 12)'
          python3.12 -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install pip==26.1.2
          "$PYTHON" -m pip install -r requirements-macos-arm64-py312.lock
          "$PYTHON" tools/check_hygiene.py --require-git-clean
          "$PYTHON" tools/verify.py integration

  spawn:
    runs-on: [self-hosted, macOS, ARM64, xrr-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify spawn
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64" and sys.version_info[:2] == (3, 12)'
          python3.12 -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install pip==26.1.2
          "$PYTHON" -m pip install -r requirements-macos-arm64-py312.lock
          "$PYTHON" tools/check_hygiene.py --require-git-clean
          "$PYTHON" tools/verify.py spawn

  regression:
    runs-on: [self-hosted, macOS, ARM64, xrr-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify regression
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64" and sys.version_info[:2] == (3, 12)'
          python3.12 -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install pip==26.1.2
          "$PYTHON" -m pip install -r requirements-macos-arm64-py312.lock
          "$PYTHON" tools/check_hygiene.py --require-git-clean
          "$PYTHON" tools/verify.py regression

  statistical:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, macOS, ARM64, xrr-ci]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify statistical
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64" and sys.version_info[:2] == (3, 12)'
          python3.12 -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install pip==26.1.2
          "$PYTHON" -m pip install -r requirements-macos-arm64-py312.lock
          "$PYTHON" tools/check_hygiene.py --require-git-clean
          "$PYTHON" tools/verify.py statistical

  distribution:
    runs-on: [self-hosted, macOS, ARM64, xrr-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64" and sys.version_info[:2] == (3, 12)'
          python3.12 -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install pip==26.1.2
          "$PYTHON" -m pip install -r requirements-macos-arm64-py312.lock
          "$PYTHON" tools/check_hygiene.py --require-git-clean
          "$PYTHON" tools/verify.py distribution --report-dir "$RUNNER_TEMP/distribution-bundle" --artifact-dir "$RUNNER_TEMP/distribution-bundle/artifacts"
      - name: Upload distribution bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xrr-distribution-${{ github.sha }}
          path: ${{ runner.temp }}/distribution-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  candidate-readiness:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, macOS, ARM64, xrr-ci]
    timeout-minutes: 60
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          python3.12 tools/release_version.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --tag "$GITHUB_REF_NAME"
      - name: Evaluate candidate readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64" and sys.version_info[:2] == (3, 12)'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if test ! -f verification/r23/tests.json; then
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3.12 -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install pip==26.1.2
          "$PYTHON" -m pip install -r requirements-macos-arm64-py312.lock
          "$PYTHON" tools/check_hygiene.py --require-git-clean
          TEST_SOURCE_COMMIT=$("$PYTHON" -c 'import json; print(json.load(open("verification/r23/tests.json", encoding="utf-8"))["source_commit"])')
          AUDIT_DIR="$RUNNER_TEMP/candidate-readiness"
          test ! -e "$AUDIT_DIR"
          mkdir "$AUDIT_DIR"
          "$PYTHON" tools/collect_test_manifest.py --repo-root "$GITHUB_WORKSPACE" --source-commit "$TEST_SOURCE_COMMIT" --lock-file "$GITHUB_WORKSPACE/requirements-macos-arm64-py312.lock" --suite tests --output "$AUDIT_DIR/tests.json"
          cmp verification/r23/tests.json "$AUDIT_DIR/tests.json"
          git diff --quiet "$TEST_SOURCE_COMMIT" HEAD -- tests
          "$PYTHON" tools/check_hygiene.py --require-git-clean
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

  identity:
    needs: [candidate-readiness, distribution]
    if: startsWith(github.ref, 'refs/tags/') && needs.candidate-readiness.outputs.ready == 'true'
    runs-on: [self-hosted, macOS, ARM64, xrr-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download distribution bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xrr-distribution-${{ github.sha }}
          path: ${{ runner.temp }}/downloaded-distribution
      - name: Verify identity
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64" and sys.version_info[:2] == (3, 12)'
          python3.12 -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install pip==26.1.2
          "$PYTHON" -m pip install -r requirements-macos-arm64-py312.lock
          "$PYTHON" tools/check_hygiene.py --require-git-clean
          "$PYTHON" tools/verify.py identity --report-dir "$RUNNER_TEMP/identity" --artifact-dir "$RUNNER_TEMP/downloaded-distribution/artifacts" --artifact-manifest "$RUNNER_TEMP/downloaded-distribution/artifact-manifest.json"

  release:
    needs: [candidate-readiness]
    if: startsWith(github.ref, 'refs/tags/') && needs.candidate-readiness.outputs.ready == 'true'
    runs-on: [self-hosted, macOS, ARM64, xrr-ci]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64" and sys.version_info[:2] == (3, 12)'
          python3.12 -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install pip==26.1.2
          "$PYTHON" -m pip install -r requirements-macos-arm64-py312.lock
          "$PYTHON" tools/check_hygiene.py --require-git-clean
          QT_QPA_PLATFORM=offscreen "$PYTHON" tools/verify.py release --report-dir "$RUNNER_TEMP/release" --artifact-dir "$RUNNER_TEMP/release/artifacts"
      - name: Upload canonical release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xrr-release-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success'
    uses: ./.github/workflows/windows-executable.yml
    with:
      source_ref: ${{ github.ref_name }}
      expected_commit: ${{ github.sha }}

  draft-release:
    needs: [release, windows]
    if: startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Download canonical release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xrr-release-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-bundle
      - name: Download Windows release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xrr-windows-executable-${{ github.sha }}
          path: ${{ runner.temp }}/windows-release
      - name: Create or update draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          shopt -s nullglob
          ASSETS=(
            "$RUNNER_TEMP/release-bundle/artifact-manifest.json"
            "$RUNNER_TEMP/release-bundle/release-identity.json"
            "$RUNNER_TEMP/release-bundle/artifacts/"*
            "$RUNNER_TEMP/windows-release/"*.exe
            "$RUNNER_TEMP/windows-release/"*.json
          )
          test "${#ASSETS[@]}" -eq 6
          for ASSET in "${ASSETS[@]}"; do
            test -f "$ASSET"
          done
          RELEASE_JSON="$RUNNER_TEMP/release.json"
          RELEASE_VIEW_ERROR="$RUNNER_TEMP/release-view.err"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            >"$RELEASE_JSON" 2>"$RELEASE_VIEW_ERROR"; then
            python3 - "$RELEASE_JSON" "${ASSETS[@]}" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              payload = json.load(stream)
          if payload.get("isDraft") is not True:
              raise SystemExit("existing GitHub Release is not a draft")
          local_names = [os.path.basename(path) for path in sys.argv[2:]]
          if len(set(local_names)) != len(local_names):
              raise SystemExit(f"local release asset names are not unique: {sorted(local_names)!r}")
          remote_names = [asset.get("name") for asset in payload.get("assets", [])]
          if sorted(remote_names) != sorted(local_names):
              raise SystemExit("remote release asset names differ from local bundle: "
                               f"remote={sorted(remote_names)!r} local={sorted(local_names)!r}")
          PY
            REMOTE_ASSET_DIR="$RUNNER_TEMP/release-assets"
            test ! -e "$REMOTE_ASSET_DIR"
            mkdir "$REMOTE_ASSET_DIR"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$REMOTE_ASSET_DIR"
            python3 - "$REMOTE_ASSET_DIR" "${ASSETS[@]}" <<'PY'
          import os
          import sys

          downloaded_names = sorted(os.listdir(sys.argv[1]))
          local_names = sorted(os.path.basename(path) for path in sys.argv[2:])
          if downloaded_names != local_names:
              raise SystemExit("downloaded release asset names differ from local bundle: "
                               f"downloaded={downloaded_names!r} local={local_names!r}")
          PY
            for ASSET in "${ASSETS[@]}"; do
              cmp "$ASSET" "$REMOTE_ASSET_DIR/$(basename "$ASSET")"
            done
          else
            if ! grep -Eiq "not found|HTTP 404" "$RELEASE_VIEW_ERROR"; then
              cat "$RELEASE_VIEW_ERROR" >&2
              exit 1
            fi
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "XRR $TAG" \
              --notes-file docs/acceptance/r23-release-acceptance.md \
              --draft \
              --latest=false
          fi

  checkpoint:
    needs: [quality, tools, unit, gui, integration, spawn, regression, statistical, distribution, candidate-readiness, identity, release, windows, draft-release]
    if: always()
    runs-on: [self-hosted, macOS, ARM64, xrr-ci]
    timeout-minutes: 10
    steps:
      - name: Require all gates
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TOOLS_RESULT: ${{ needs.tools.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          GUI_RESULT: ${{ needs.gui.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SPAWN_RESULT: ${{ needs.spawn.result }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
          STATISTICAL_RESULT: ${{ needs.statistical.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
          READINESS_RESULT: ${{ needs.candidate-readiness.result }}
          READY: ${{ needs.candidate-readiness.outputs.ready }}
          IDENTITY_RESULT: ${{ needs.identity.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          DRAFT_RELEASE_RESULT: ${{ needs.draft-release.result }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = success
          test "$TOOLS_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$GUI_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$SPAWN_RESULT" = success
          test "$REGRESSION_RESULT" = success
          case "$REF" in
            refs/tags/*) test "$STATISTICAL_RESULT" = success ;;
            *) test "$STATISTICAL_RESULT" = skipped ;;
          esac
          test "$DISTRIBUTION_RESULT" = success
          case "$REF" in
            refs/tags/*) test "$READINESS_RESULT" = success ;;
            *) test "$READINESS_RESULT" = skipped ;;
          esac
          case "$REF" in
            refs/tags/*)
              test "$READY" = true
              test "$IDENTITY_RESULT" = success
              test "$RELEASE_RESULT" = success
              test "$WINDOWS_RESULT" = success
              test "$DRAFT_RELEASE_RESULT" = success
              ;;
            *)
              test "$IDENTITY_RESULT" = skipped
              test "$RELEASE_RESULT" = skipped
              test "$WINDOWS_RESULT" = skipped
              test "$DRAFT_RELEASE_RESULT" = skipped
              ;;
          esac
