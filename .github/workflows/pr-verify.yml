name: pr-verify

"on":
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  standard:
    name: Verify ${{ matrix.mode }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode:
          - quality
          - tools
          - unit
          - gui
          - integration
          - spawn
          - regression
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up locked macOS Python
        id: python
        uses: ./.github/actions/setup-macos-python
      - name: Verify ${{ matrix.mode }}
        env:
          PYTHON: ${{ steps.python.outputs.python }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PYTHON" = "${{ steps.python.outputs.python }}"
          if test "${{ matrix.mode }}" = gui; then
            QT_QPA_PLATFORM=offscreen "$PYTHON" tools/verify.py gui
          else
            "$PYTHON" tools/verify.py "${{ matrix.mode }}"
          fi
      - name: Clean the owned macOS environment
        if: ${{ always() && steps.python.outputs.job-root != '' }}
        uses: ./.github/actions/cleanup-macos-python
        with:
          job-root: ${{ steps.python.outputs.job-root }}

  checkpoint:
    needs: [standard]
    if: ${{ always() && !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Require all PR gates
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.standard.result }}" = success
