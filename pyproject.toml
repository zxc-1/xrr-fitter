[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "xrr-fitter"
dynamic = ["version"]
description = "X-ray reflectivity fitting application"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.2",
  "scipy==1.18.0",
  "periodictable==2.1.0",
  "pandas==2.3.3",
  "xlsxwriter==3.2.9",
  "matplotlib==3.11.1",
  "pyqtgraph==0.14.0",
  "orsopy==1.2.3",
  "jsonschema==4.26.0",
  "PySide6==6.11.2",
]

[project.gui-scripts]
xrr-fitter = "xrr_fitter.__main__:main"

[project.scripts]
xrr-fitter-cli = "xrr_fitter.cli.main:main"

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "pytest-qt==4.5.0",
  "openpyxl==3.1.5",
  "radon==6.0.1",
  "build==1.5.0",
  "refnx @ git+https://github.com/refnx/refnx.git@3d3808f66a14a8200eba020f8dff53f4d1e059bc",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["xrr_fitter*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "xrr_fitter.version.__version__"}

# Extra direct requirements needed to freeze the Windows standalone executable.
# Deliberately not an optional-dependencies group: every extras group is injected
# into the published wheel's Requires-Dist, and PyInstaller is a build-time tool
# that must not become a runtime requirement for library consumers.
[tool.xrr.windows-packaging]
requires = ["pyinstaller==6.21.0"]

[tool.xrr.audit]
requires = [
  "coverage==7.16.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "scipy-stubs==1.18.0.0",
  "pip==26.1.2",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
show_error_codes = true
files = [
  "src/xrr_fitter/analysis/profile_selection.py",
  "src/xrr_fitter/analysis/profile_tasks.py",
  "src/xrr_fitter/fit/stage_schedule.py",
  "src/xrr_fitter/fit/stages.py",
  "src/xrr_fitter/services/batch.py",
  "src/xrr_fitter/services/batch_publication.py",
  "src/xrr_fitter/services/batch_routing.py",
]

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
concurrency = ["multiprocessing", "thread"]
patch = ["subprocess"]
source = ["src/xrr_fitter"]
omit = ["*/xrr_fitter/gui/*", "*/xrr_fitter/__main__.py"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = [
  "slow: long-running statistical or recovery verification",
  "approved_data: requires the approved, hash-bound approved-data manifest",
  "visible_gui: requires a visible desktop session",
  "spawn: starts real multiprocessing spawn workers",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tools", "tests"]
extend-exclude = ["docs", "examples", "verification"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# Line length is enforced by the formatter; do not fail lint on legacy long lines
# while ruff is being adopted incrementally.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["F403", "F405"]

[tool.ruff.format]
line-ending = "lf"
