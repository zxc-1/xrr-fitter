# Pre-commit hooks for local enforcement. Enable with: pre-commit install
# Ruff is managed by pre-commit in its own isolated environment, independent of
# the project's pinned runtime/test lock.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix]
      - id: ruff-format
        name: ruff format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        # Published example projects are byte-reproducible output of
        # write_examples(); appending a newline breaks the round-trip contract
        # asserted by tests/unit/io/test_project_codec.py.
        exclude: ^examples/.*\.(xrrproj\.json|xy)$
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
